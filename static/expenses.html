<div id="expenses">
  <h3>Expenses</h3>
  <ul>
    <li>Alice paid $30 for dinner</li>
    <li>Bob paid $20 for drinks</li>
    <li>Charlie paid $50 for tickets</li>
    <li>Alice paid $20 for cab</li>
  </ul>
  <form action="./expenses#expenses" method="POST" target="htmz">
    <h4>New expense</h4>
    <label>
      Who paid ?
      <select name="payer">
        <option value="alice">Alice</option>
        <option value="bob">Bob</option>
        <option value="charlie">Charlie</option>
      </select>
    </label>
    <label>Amount: <input type="number" name="amount" /></label>
    <label>Description: <input type="text" name="description" /></label>
    <label>
      Split between:
      <input type="checkbox" name="split-between" value="alice" /> Alice
      <input type="checkbox" name="split-between" value="bob" /> Bob
      <input type="checkbox" name="split-between" value="charlie" />
      Charlie
    </label>
    <input type="submit" value="Add expense" />
  </form>

  <h3>Balances</h3>
  <ul>
    <li>Bob owes $15 to Alice</li>
    <li>Bob owes $15 to Charlie</li>
  </ul>
</div>
