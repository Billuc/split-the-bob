[package]
name = "split-the-bob"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.15.4"
axum = "0.8.8"
axum-extra = { version = "0.12.5", features = ["form"] }
lazy_static = "1.5.0"
loadenv = "0.1.4"
rand = "0.10.0"
reqwest = { version = "0.13.2", features = ["json"] }
serde = "1.0.228"
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["json", "runtime-tokio", "sqlite"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["fs", "set-header"] }
